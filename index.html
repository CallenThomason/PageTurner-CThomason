<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageTurner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-teal-50 text-slate-900">
    <header class="flex flex-col md:flex-row md:justify-between items-center bg-white px-auto py-6 ">
        <h1 class="flex mx-16 text-xl font-bold">Page Turner</h1>
        <nav class="flex gap-8 mx-16 text-sm text-slate-600">
            <p>Browse</p>
            <p>Hours</p>
        </nav>
    </header>
    <main class="flex flex-col mt-14 mx-4 text-sm md:text-lg md:mx-52">
        <div class="text-align">
            <h1 class="text-lg md:text-xl font-bold"> Staff Picks</h1>
            <p class="text-slate-600">What we are pressing into people's hands this month</p>
        </div>
        <div class="grid grid-col-1 md:grid-cols-3 gap-8 py-12">
            <div class="bg-white border-2 border-slate-200 rounded-lg p-6 flex-row">
                <img class="w-full h-102 object-cover rounded-lg" src="assets/moby.jpg" alt="Moby Dick Cover">
                <div class="pt-6 ">
                    <p class="font-semibold text-slate-900">Moby-Dick</p>
                    <p class="text-xs text-slate-600">Herman-Melville</p>
                    <p class="font-semibold text-teal-700">$12</p>
                </div>
            </div>
            <div class="bg-white border-2 border-slate-200 rounded-lg p-6 flex-row">
                <img class="w-full h-102 object-cover rounded-lg" src="assets/frank.jpg" alt="Moby Dick Cover">
                <div class="pt-6 ">
                    <p class="font-semibold text-slate-900">Frankenstien</p>
                    <p class="text-xs text-slate-600">Mary Shelley</p>
                    <p class="font-semibold text-teal-700">$14</p>
                </div>
            </div>
            <div class="bg-white border-2 border-slate-200 rounded-lg p-6 flex-row">
                <img class="w-full h-102 object-cover rounded-lg" src="assets/call.jpg" alt="Moby Dick Cover">
                <div class="pt-6 ">
                    <p class="font-semibold text-slate-900">The Call of The Wild</p>
                    <p class="text-xs text-slate-600">Jack London</p>
                    <p class="font-semibold text-teal-700">$9</p>
                </div>
            </div>
        </div>

        <div class=" mx-auto w-fit bg-teal-700 mb-14 py-4 px-8 gap-2 rounded-lg ">
            <p class="flex justify-center font-semibold text-white">Browse the Shelves</p>
        </div>

    </main>

    
</body>

</html>
